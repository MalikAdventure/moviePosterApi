version: '3.8'

services:
  db:
    image: postgres:15-alpine
    ports:
      - '5433:5432'
    restart: always
    env_file: .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  web:
    build: .
    restart: always
    env_file: .env
    volumes:
      - .:/app
    ports:
      - '8000:8000'
    depends_on:
      - db

volumes:
  postgres_data:
